name: Build & publish APK

# Every push to main that bumps versionCode in AndroidManifest.xml builds a signed APK
# and publishes it to the public Siddz-17/aurelius7-releases repo (APK + latest.json),
# which the in-app updater reads.
on:
  push:
    branches: [main]
    paths: ['AndroidManifest.xml', 'src/**', 'res/**', 'assets/**', 'build.sh', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23 >/dev/null

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > aurelius7.keystore

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then unset KS_PASS; fi
          ./build.sh

      - name: Read version
        id: v
        run: |
          echo "name=$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -o 'versionCode="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AURELIUS7-v${{ steps.v.outputs.name }}
          path: out/*.apk

      - name: Publish to aurelius7-releases
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret RELEASES_TOKEN is missing"; exit 1; fi
          git clone -q "https://x-access-token:${TOKEN}@github.com/Siddz-17/aurelius7-releases.git" rel
          CUR=$(python3 -c "import json;print(json.load(open('rel/latest.json'))['versionCode'])" 2>/dev/null || echo 0)
          if [ "$CODE" -le "$CUR" ]; then
            echo "versionCode $CODE <= published $CUR, nothing to publish"; exit 0
          fi
          mkdir -p rel/apk
          cp "out/AURELIUS7-v${NAME}.apk" rel/apk/
          python3 - <<'EOF'
          import json, os, hashlib
          name, code = os.environ["NAME"], int(os.environ["CODE"])
          json.dump({
            "versionCode": code,
            "versionName": name,
            "url": f"https://raw.githubusercontent.com/Siddz-17/aurelius7-releases/main/apk/AURELIUS7-v{name}.apk",
            "sha256": hashlib.sha256(open(f"rel/apk/AURELIUS7-v{name}.apk", "rb").read()).hexdigest(),
            "notes": (os.environ.get("MSG") or "").splitlines()[0] if os.environ.get("MSG") else ""
          }, open("rel/latest.json", "w"), indent=2)
          EOF
          cat > rel/README.md <<EOF
          # AURELIUS7 releases
          Latest: **v${NAME}**: [download APK](apk/AURELIUS7-v${NAME}.apk)

          Installed apps update themselves from \`latest.json\`.
          EOF
          cd rel
          git config user.name "aurelius7-bot"
          git config user.email "aurelius7-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "v${NAME} (${CODE})"
          git push -q origin HEAD:main
          echo "Published v${NAME}"
